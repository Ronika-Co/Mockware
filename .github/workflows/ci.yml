name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check src/ tests/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest tests/ -v

  docs:
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pyyaml click
      - run: pyinstaller --onefile --name mockware src/mockware/cli.py
      - shell: bash
        run: |
          SUFFIX=
          [ "${{ runner.os }}" = "Windows" ] && SUFFIX=.exe
          PLATFORM=linux
          [ "${{ runner.os }}" = "Windows" ] && PLATFORM=windows
          mv dist/mockware$SUFFIX dist/mockware-$PLATFORM$SUFFIX
          echo "ARTIFACT_NAME=mockware-${{ runner.os }}" >> $GITHUB_ENV
          echo "ARTIFACT_PATH=dist/mockware-$PLATFORM$SUFFIX" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mockware-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            mockware*
          body: |
            ## mockware ${{ github.ref_name }}

            Pre-built binaries for Linux and Windows (via PyInstaller).

            - `mockware-linux` — Linux
            - `mockware-windows.exe` — Windows

            ### Usage

            ```bash
            # Run directly
            ./mockware-linux --help

            # Or rename and add to PATH
            mv mockware-linux /usr/local/bin/mockware
            mockware generate templates/ -o mock-sdk
            ```
          draft: false
          prerelease: false
