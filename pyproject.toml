[project]
name = "mockware"
version = "0.2.0"
description = "Generate mock SDK layers for embedded unit testing from YAML templates — supports C and C++ (classes, namespaces, virtual methods)."
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.urls]
repository = "https://github.com/Ronika-Co/Mockware"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mockware"]

[project.scripts]
mockware = "mockware.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
