[project]
name = "mockware"
version = "0.0.1"
description = "Generate mock/stub SDK layers for embedded unit testing — parse real SDK headers into a YAML knowledge base, then produce stub headers + overridable function-pointer implementations."
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "pycparser>=2.21",
]

[project.urls]
repository = "https://github.com/your-org/mockware"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mockware"]

[project.scripts]
mockware = "mockware.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
target-version = "py310"
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
